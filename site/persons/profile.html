<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persona · Archivo Público Venezuela</title><link rel="stylesheet" href="../assets/site.css"></head><body><header class="masthead"><a class="brand" href="../index.html"><span class="brand-mark">APV</span><span>Archivo Público Venezuela</span></a><span class="status">Persona</span></header><main class="document-page"><a class="breadcrumb" href="../index.html">← Volver al archivo</a><h1 id="person-name">Cargando…</h1><section class="case-section"><p class="section-label">Apariciones y relaciones documentales</p><div id="relations"></div></section></main><script>
const id=new URLSearchParams(location.search).get('id');
fetch('../data/people.json').then(r=>r.json()).then(all=>{const p=all.find(x=>x.id===id);if(!p)throw 0;document.title=p.name+' · APV';document.querySelector('#person-name').textContent=p.name;document.querySelector('#relations').replaceChildren(...p.relations.map(x=>{const a=document.createElement('article');a.className='finding';const h=document.createElement('strong');h.textContent=x.quality;const d=document.createElement('p');d.textContent=`Acto: ${x.act} · Documento: ${x.document} · Localizador: ${x.locator}`;a.append(h,d);return a;}));}).catch(()=>{document.querySelector('#person-name').textContent='Persona no localizada';});
</script></body></html>
